image:
  repository: ghcr.io/jalet/pulumi-operator-ui
  # Defaults to .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Namespaces to watch. Empty watches all namespaces through a ClusterRole; otherwise the
# chart creates one Role and RoleBinding per namespace.
namespaces: []

database:
  # Secret holding the PostgreSQL URL (required). A CNPG app secret works with caSecret.
  urlSecret:
    name: ""
    key: uri
  # Secret with the database CA (for CNPG: <cluster>-ca). Required unless the URL has
  # sslmode=verify-full: the app refuses unverified TLS to a non-localhost database.
  caSecret:
    name: ""
    key: ca.crt

oidc:
  issuer: ""
  clientID: ""
  redirectURL: ""
  # Sign out also ends the IdP session when the IdP supports RP-initiated logout; the IdP
  # must then accept the app root (https://<host>/) as a post-logout redirect URI. True keeps
  # sign-out in the app only.
  localLogout: false
  clientSecret:
    name: ""
    key: client-secret
  # Optional ConfigMap with an extra CA bundle for the IdP.
  caConfigMap:
    name: ""
    key: ca.crt

auth:
  claim: groups
  # Claim values allowed to sign in (required). Values must not contain commas.
  allowed: []

session:
  keySecret:
    name: ""
    key: key
  # Optional previous key, accepted for verification during rotation.
  previousKeySecret:
    name: ""
    key: key
  maxAge: 8h

retention:
  runs: 4320h
  auth: 8760h

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []

networkPolicy:
  enabled: true
  # Set these selectors to your Gateway's pods; the empty defaults allow any pod.
  gateway:
    namespaceSelector: {}
    podSelector: {}
  metricsScraper:
    namespaceSelector: {}
    podSelector: {}
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # Kubernetes API server endpoint CIDRs (required when enabled), for example the
  # addresses behind `kubectl get endpoints kubernetes -n default`.
  apiServer:
    cidrs: []
    port: 6443
  database:
    namespaceSelector: {}
    podSelector: {}
    port: 5432
  idp:
    cidrs:
      - 0.0.0.0/0
    port: 443
  # Only rendered when s3History.enabled.
  s3:
    cidrs:
      - 0.0.0.0/0
    port: 443

# IANA time zone for the stack timeline's day headers ("Today", "Yesterday").
displayTimezone: UTC

# Optional color overrides; keys left out keep the built-in colors. Quote every value: an
# unquoted #fff is a YAML comment. Keys for light and dark: page, panel, line, ink, muted,
# focus, ok, run, attention, bad, neutral, okText, runText, attentionText, badText,
# neutralText. Values are #rgb, #rrggbb or #rrggbbaa. Changing the theme restarts the pod.
theme: {}
#  light:
#    page: "#ffffff"
#    bad: "#d93025"
#  dark:
#    page: "#000000"
#  brandBar: ["#4a7c9b", "#5a8fa8", "#6aa0b8", "#c8a84e", "#d8b85e"]

# Optional: read Pulumi's update history from each Stack's S3 backend (see README).
s3History:
  enabled: false
  interval: 5m
  # Default region for backends whose URL has no ?region=; empty uses the SDK default.
  region: ""
  # Use the pod's ambient AWS identity (EKS Pod Identity or IRSA via serviceAccount
  # annotations) instead of static keys; credentialsSecret is then not needed.
  ambientCredentials: false
  # Secret with a dedicated read-only IAM user's keys (docs/iam/s3-history-policy.json).
  credentialsSecret:
    name: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key

serviceAccount:
  # For example eks.amazonaws.com/role-arn for IRSA.
  annotations: {}

serviceMonitor:
  enabled: false
