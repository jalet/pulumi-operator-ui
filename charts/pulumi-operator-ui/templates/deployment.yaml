{{- include "pou.validate" . }}
{{- $v := .Values }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pou.fullname" . }}
  labels:
    {{- include "pou.labels" . | nindent 4 }}
spec:
  # One replica by design: the SSE broker is in-process. Upserts are idempotent, so the
  # brief overlap during a rolling update is safe.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "pou.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if include "pou.theme" . }}
      annotations:
        checksum/theme: {{ toYaml $v.theme | sha256sum }}
      {{- end }}
      labels:
        {{- include "pou.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pou.fullname" . }}
      # The watch needs the token; its ClusterRole or Roles grant only get/list/watch.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # The distroless nonroot user; fsGroup makes mounted secrets group-readable by it.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pulumi-operator-ui
          image: "{{ $v.image.repository }}:{{ $v.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args:
            - --http-addr=:8080
            - --metrics-addr=:9090
            {{- with $v.namespaces }}
            - {{ printf "--namespaces=%s" (join "," .) | quote }}
            {{- end }}
            - {{ printf "--oidc.issuer=%s" $v.oidc.issuer | quote }}
            - {{ printf "--oidc.client-id=%s" $v.oidc.clientID | quote }}
            - --oidc.client-secret-file=/etc/pou/secrets/client-secret
            - {{ printf "--oidc.redirect-url=%s" $v.oidc.redirectURL | quote }}
            {{- if $v.oidc.caConfigMap.name }}
            - --oidc.ca-file=/etc/pou/oidc-ca/ca.crt
            {{- end }}
            {{- if $v.oidc.localLogout }}
            - --oidc.local-logout=true
            {{- end }}
            - {{ printf "--auth.claim=%s" $v.auth.claim | quote }}
            - {{ printf "--auth.allowed=%s" (join "," $v.auth.allowed) | quote }}
            - --session.key-file=/etc/pou/secrets/session-key
            {{- if $v.session.previousKeySecret.name }}
            - --session.previous-key-file=/etc/pou/secrets/session-previous-key
            {{- end }}
            - {{ printf "--session.max-age=%s" $v.session.maxAge | quote }}
            - {{ printf "--retention=%s" $v.retention.runs | quote }}
            - {{ printf "--auth-retention=%s" $v.retention.auth | quote }}
            - {{ printf "--display-timezone=%s" $v.displayTimezone | quote }}
            {{- if eq (toString $v.logs.diffs) "false" }}
            - --logs.diffs=false
            {{- end }}
            {{- if include "pou.theme" . }}
            - --theme-file=/etc/pou/theme/theme.yaml
            {{- end }}
            {{- if $v.database.caSecret.name }}
            - --database.ca-file=/etc/pou/db-ca/ca.crt
            {{- end }}
            {{- if $v.s3History.enabled }}
            - --s3-history.enabled=true
            - {{ printf "--s3-history.interval=%s" $v.s3History.interval | quote }}
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $v.database.urlSecret.name }}
                  key: {{ $v.database.urlSecret.key }}
            {{- if $v.s3History.enabled }}
            {{- with $v.s3History.region }}
            - name: AWS_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- if not $v.s3History.ambientCredentials }}
            {{- $aws := required "s3History.credentialsSecret.name is required when s3History.enabled (or set s3History.ambientCredentials)" $v.s3History.credentialsSecret.name }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $aws }}
                  key: {{ $v.s3History.credentialsSecret.accessKeyIdKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $aws }}
                  key: {{ $v.s3History.credentialsSecret.secretAccessKeyKey }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /etc/pou/secrets
              readOnly: true
            {{- if $v.database.caSecret.name }}
            - name: db-ca
              mountPath: /etc/pou/db-ca
              readOnly: true
            {{- end }}
            {{- if $v.oidc.caConfigMap.name }}
            - name: oidc-ca
              mountPath: /etc/pou/oidc-ca
              readOnly: true
            {{- end }}
            {{- if include "pou.theme" . }}
            - name: theme
              mountPath: /etc/pou/theme
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          projected:
            defaultMode: 0440 # owner root, group 65532 via fsGroup; no world access
            sources:
              - secret:
                  name: {{ $v.oidc.clientSecret.name }}
                  items:
                    - key: {{ $v.oidc.clientSecret.key }}
                      path: client-secret
              - secret:
                  name: {{ $v.session.keySecret.name }}
                  items:
                    - key: {{ $v.session.keySecret.key }}
                      path: session-key
              {{- if $v.session.previousKeySecret.name }}
              - secret:
                  name: {{ $v.session.previousKeySecret.name }}
                  items:
                    - key: {{ $v.session.previousKeySecret.key }}
                      path: session-previous-key
              {{- end }}
        {{- if $v.database.caSecret.name }}
        - name: db-ca
          secret:
            secretName: {{ $v.database.caSecret.name }}
            defaultMode: 0444
            items:
              - key: {{ $v.database.caSecret.key }}
                path: ca.crt
        {{- end }}
        {{- if $v.oidc.caConfigMap.name }}
        - name: oidc-ca
          configMap:
            name: {{ $v.oidc.caConfigMap.name }}
            items:
              - key: {{ $v.oidc.caConfigMap.key }}
                path: ca.crt
        {{- end }}
        {{- if include "pou.theme" . }}
        - name: theme
          configMap:
            name: {{ include "pou.fullname" . }}-theme
            items:
              - key: theme.yaml
                path: theme.yaml
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
