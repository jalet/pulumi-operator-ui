{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pou.fullname" . }}
  labels:
    {{- include "pou.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # SSE streams stay open for the session's lifetime; "0s" disables the request
    # timeout for this path only.
    - matches:
        - path:
            type: PathPrefix
            value: /events
      timeouts:
        request: 0s
      backendRefs:
        - name: {{ include "pou.fullname" . }}
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "pou.fullname" . }}
          port: 8080
{{- end }}
