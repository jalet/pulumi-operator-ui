[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
ko = "0.19.1"
helm = "4.3.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.8.0"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "release-0.24"
"github:tailwindlabs/tailwindcss" = { version = "4.3.3", bin = "tailwindcss" }

[env]
ENVTEST_K8S_VERSION = "1.37.x"
# Tests terminate their own containers; the Ryuk reaper does not start under rootless Podman.
TESTCONTAINERS_RYUK_DISABLED = "true"

[tasks.fmt]
run = "golangci-lint fmt"

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.test]
run = '''
export KUBEBUILDER_ASSETS="$(setup-envtest use "$ENVTEST_K8S_VERSION" -p path)"
go test -race -shuffle=on ./...
'''

[tasks.vuln]
run = "govulncheck ./..."

[tasks."chart:test"]
run = '''
helm lint --strict charts/pulumi-operator-ui -f test/chart/testdata/minimal.yaml
go test ./test/chart/...
'''

[tasks.css]
description = "Compile Tailwind into internal/web/static/app.css"
run = "tailwindcss -i web/styles/input.css -o internal/web/static/app.css --minify"

[tasks."css:check"]
description = "Fail if the committed CSS is stale"
run = "mise run css && git diff --exit-code -- internal/web/static/app.css"

[tasks.build]
run = "ko build --local ./cmd/pulumi-operator-ui"

[tasks.devidp]
run = "go run ./hack/devidp"

[tasks."image:publish"]
description = "Build and push the image to ghcr.io; VERSION=<tag> is required"
run = '''
: "${VERSION:?set VERSION, for example VERSION=0.1.0-dev.8}"
KO_DOCKER_REPO=ghcr.io/jalet/pulumi-operator-ui ko build --bare --tags "$VERSION" ./cmd/pulumi-operator-ui
'''

[tasks."chart:publish"]
description = "Package the chart at VERSION (chart version and appVersion) and push it to ghcr.io"
run = '''
: "${VERSION:?set VERSION, for example VERSION=0.1.0-dev.8}"
out="$(mktemp -d)"
trap 'rm -rf "$out"' EXIT
helm package charts/pulumi-operator-ui --version "$VERSION" --app-version "$VERSION" -d "$out"
helm push "$out/pulumi-operator-ui-$VERSION.tgz" oci://ghcr.io/jalet/helm-charts
'''
