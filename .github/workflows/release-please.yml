name: release-please

# Keeps a release PR open that collects conventional commits into the changelog and bumps the
# version in Chart.yaml. Merging it tags vX.Y.Z and creates the GitHub release; the publish job
# then builds, pushes and signs the image and chart. Publishing lives here, not in a tag
# workflow: a tag pushed with an Actions token does not trigger other workflows.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token, not GITHUB_TOKEN: the release PR must trigger CI, which branch
      # protection requires before it can merge.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push image and chart to ghcr.io
      id-token: write # keyless cosign signing
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Reuse what CI on main cached (caches are per branch, and this runs in main's context).
      # The paths must match CI's exactly: they are part of the cache entry's version.
      # Restore only: a release build never writes the cache, and pull request caches are in
      # their own scope, so they cannot reach it.
      - name: Go cache paths
        id: go-paths
        run: |
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-paths.outputs.mod }}
            ${{ steps.go-paths.outputs.build }}
            ~/.cache/golangci-lint
            ~/.local/share/kubebuilder-envtest
          key: go-${{ runner.os }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('mise.lock') }}-
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build and push image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/jalet/pulumi-operator-ui
        run: |
          echo "$GITHUB_TOKEN" | ko login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ko build --bare --tags "${VERSION},latest" --sbom spdx --image-refs refs.txt \
            ./cmd/pulumi-operator-ui
      - name: Sign image
        run: |
          while read -r ref; do cosign sign --yes "$ref"; done < refs.txt
      - name: Package, push and sign chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/pulumi-operator-ui --version "$VERSION" --app-version "$VERSION"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "pulumi-operator-ui-${VERSION}.tgz" oci://ghcr.io/jalet/helm-charts 2>&1 | tee push.txt
          digest="$(awk '/^Digest:/ {print $2}' push.txt)"
          test -n "$digest"
          cosign sign --yes "ghcr.io/jalet/helm-charts/pulumi-operator-ui@${digest}"
