name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: CSS is up to date
        run: mise run css:check
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
      - name: Vulnerabilities
        run: mise run vuln
      - name: Chart
        run: mise run chart:test
      - name: Build image
        env:
          VERSION: ci
        run: ko build --push=false ./cmd/pulumi-operator-ui
