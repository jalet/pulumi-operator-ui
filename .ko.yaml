# Digest-pinned so a rebuild of the same commit gets the same base; Renovate bumps the digest.
defaultBaseImage: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
defaultPlatforms:
  - linux/amd64
  - linux/arm64
builds:
  - id: pulumi-operator-ui
    main: ./cmd/pulumi-operator-ui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Env.VERSION}}
