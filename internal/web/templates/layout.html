{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>
<title>{{block "title" .}}Pulumi stacks{{end}}</title>
<link rel="icon" href="{{asset "favicon.ico"}}" sizes="16x16 32x32 48x48">
<link rel="stylesheet" href="{{asset "app.css"}}">
<script src="{{asset "htmx.min.js"}}" defer></script>
<script src="{{asset "sse.js"}}" defer></script>
<script src="{{asset "app.js"}}" defer></script>
</head>
<body hx-ext="sse" sse-connect="/events" class="min-h-screen">
<div class="brand-bar"></div>
<div hidden hx-get="/fragments/session" hx-trigger="sse:session-expired" hx-swap="none"></div>
<header class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
  <a class="text-sm font-bold tracking-tight" href="/">Pulumi stacks</a>
  <div class="flex items-center gap-4">{{with user}}<span class="text-sm text-muted">{{.}}</span>{{end}}<form method="post" action="/auth/logout"><button type="submit" class="text-sm text-muted hover:text-ink">Sign out</button></form></div>
</header>
<main class="mx-auto max-w-6xl px-4 pb-12">
{{block "content" .}}{{end}}
</main>
</body>
</html>{{end}}

{{define "commit"}}{{if .Commit}}<code {{if eq .CommitSource "stack"}}class="commit commit-approx" title="approximate: taken from the Stack when the run was first seen"{{else}}class="commit"{{end}}>{{shortCommit .Commit}}</code>{{else}}<span class="text-muted">unknown</span>{{end}}{{end}}
